<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Manage your appointment | NOVA Dental Studio</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>main{max-width:560px;margin:8vh auto;padding:0 20px}.card{background:var(--paper-2);padding:28px}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.lb-slot-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}button.lb-slot[aria-pressed=true]{background:var(--green);color:#fff}</style></head>
<body><main id="main-content"><div class="card"><h1 id="h">Your appointment</h1><p id="info" role="status" aria-live="polite">…</p><div id="actions" hidden>
<div class="row"><button class="button button-outline" id="cancelBtn" type="button">Cancel appointment</button></div>
<h2 style="font-size:18px;margin-top:26px">Reschedule</h2><label class="form-field"><span>New date</span><input type="date" id="rdate"></label><div id="rslots" class="lb-slot-grid"></div><div class="row"><button class="button button-dark" id="resBtn" type="button" disabled>Confirm new time</button></div>
</div><p id="msg" role="status" aria-live="polite" style="color:var(--rust)"></p><p><a href="index.html">← NOVA Dental Studio</a></p></div></main>
<script>
(()=>{const q=new URLSearchParams(location.search),token=q.get("token")||"",$=id=>document.getElementById(id);let appt,pick="";
const post=(p,b)=>fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(async r=>({ok:r.ok,j:await r.json().catch(()=>({}))}));
const say=m=>{$("msg").textContent=m};
async function load(){const r=await fetch(`/api/booking/manage?token=${encodeURIComponent(token)}`);const j=await r.json().catch(()=>({}));
 if(!r.ok||!j.ok){$("info").textContent="This link is not valid.";return}appt=j.appointment;$("info").textContent=`${appt.scheduled_at.replace("T"," ")} — ${appt.status}`;$("actions").hidden=!["pending","confirmed"].includes(appt.status);
 const d=new Date();$("rdate").min=d.toISOString().slice(0,10)}
$("cancelBtn").onclick=async()=>{if(!confirm("Cancel this appointment?"))return;const r=await post("/api/booking/cancel",{token});say(r.ok?"Appointment cancelled.":(r.j.error==="not_changeable"?"It is too late to cancel online. Please call the clinic.":"Could not cancel."));if(r.ok)load()};
$("rdate").onchange=async()=>{pick="";$("resBtn").disabled=true;const box=$("rslots");box.replaceChildren();
 const r=await fetch(`/api/availability?service=${encodeURIComponent(appt.service)}&date=${$("rdate").value}&dentist=any`);const j=await r.json().catch(()=>({}));
 if(!j.ok||!j.slots.length){box.textContent="No times available that day.";return}
 for(const s of j.slots){const b=document.createElement("button");b.type="button";b.className="button button-outline lb-slot";b.textContent=s.time;b.setAttribute("aria-pressed","false");b.onclick=()=>{pick=s.time;box.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));$("resBtn").disabled=false};box.append(b)}};
$("resBtn").onclick=async()=>{const r=await post("/api/booking/reschedule",{token,date:$("rdate").value,time:pick});say(r.ok?"Rescheduled. The clinic will confirm the new time.":(r.j.error==="slot_unavailable"?"That time is no longer free (or your dentist is not available then).":"Could not reschedule."));if(r.ok)load()};
load()})();
</script></body></html>
