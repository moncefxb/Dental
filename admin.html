
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="same-origin">
<title>لوحة السكرتيرة | NOVA Dental Studio</title>

<style>
:root {
  color-scheme: light;
  --ink:#172b3a;
  --muted:#667783;
  --line:#e3eaf0;
  --page:#f4f7fa;
  --blue:#176b87;
  --blue-dark:#10566f;
  --green:#14784e;
  --red:#b43c3c;
  --orange:#96611a;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--page);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
button,input,select { font:inherit; }
button { cursor:pointer; }
[hidden] { display:none!important; }

.topbar {
  background:#fff;
  border-bottom:1px solid var(--line);
  padding:16px;
}
.topbar-inner {
  max-width:980px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.brand { font-weight:800; font-size:18px; }
.brand span { color:var(--blue); }
.subtitle { color:var(--muted); font-size:12px; margin-top:3px; }

main {
  max-width:980px;
  margin:28px auto;
  padding:0 16px 40px;
}
.panel {
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:22px;
  box-shadow:0 5px 22px rgba(25,55,75,.04);
}
.login-panel { max-width:420px; margin:54px auto; }
h1 { font-size:24px; margin:0 0 8px; }
h2 { font-size:19px; margin:0; }
.muted { color:var(--muted); font-size:13px; line-height:1.7; }

label {
  display:block;
  font-weight:650;
  font-size:13px;
  margin:17px 0 7px;
}
input,select {
  width:100%;
  min-height:46px;
  padding:10px 12px;
  border:1px solid #d4dee6;
  border-radius:10px;
  background:#fff;
  color:var(--ink);
  outline:none;
}
input:focus,select:focus {
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(23,107,135,.12);
}
.btn {
  border:0;
  border-radius:10px;
  padding:11px 15px;
  min-height:42px;
  font-weight:700;
  background:var(--blue);
  color:#fff;
}
.btn:hover { background:var(--blue-dark); }
.btn:disabled { opacity:.55; cursor:not-allowed; }
.btn-light { background:#edf3f6; color:var(--ink); }
.btn-light:hover { background:#e0eaf0; }
.btn-green { background:var(--green); }
.btn-red { background:var(--red); }
.full { width:100%; margin-top:20px; }

.message {
  margin-top:14px;
  font-size:13px;
  line-height:1.6;
  color:var(--red);
}
.success-message { color:var(--green); }

.toolbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  margin-bottom:18px;
}
.stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin:18px 0;
}
.stat {
  background:#fff;
  border:1px solid var(--line);
  border-radius:13px;
  padding:15px;
}
.stat strong {
  display:block;
  font-size:26px;
  margin-bottom:3px;
}
.stat span { font-size:12px; color:var(--muted); }

.manual-form {
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
  margin:18px 0;
}
.manual-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 14px;
}
.manual-form button { margin-top:18px; }

.filters {
  display:grid;
  grid-template-columns:1fr 190px;
  gap:10px;
  margin-bottom:14px;
}
.appointment-list { display:grid; gap:12px; }
.appointment {
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
}
.appointment-head {
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin-bottom:13px;
}
.patient-name {
  font-size:17px;
  font-weight:800;
  overflow-wrap:anywhere;
}
.status {
  display:inline-block;
  border-radius:30px;
  padding:5px 10px;
  font-size:11px;
  font-weight:750;
  white-space:nowrap;
  background:#fff3d9;
  color:var(--orange);
}
.status.confirmed { background:#e4f5ec; color:var(--green); }
.status.rejected,.status.cancelled {
  background:#fce9e9;
  color:var(--red);
}
.details {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.detail {
  min-width:0;
  font-size:13px;
  overflow-wrap:anywhere;
}
.detail small {
  display:block;
  color:var(--muted);
  margin-bottom:3px;
  font-size:11px;
}
.reference {
  direction:ltr;
  text-align:right;
  font-family:ui-monospace,monospace;
  overflow-wrap:anywhere;
}
.notes {
  margin-top:12px;
  padding:10px;
  border-radius:9px;
  background:#f5f8fa;
  font-size:13px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.actions {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:15px;
  border-top:1px solid var(--line);
  padding-top:13px;
}
.actions .btn { flex:1 1 110px; font-size:12px; }

.schedule-box {
  margin-top:15px;
  padding:14px;
  background:#f5f8fa;
  border:1px solid var(--line);
  border-radius:12px;
}
.schedule-box label { margin-top:0; }
.schedule-box input { direction:ltr; }
.schedule-box .btn { margin-top:10px; width:100%; }
.schedule-current {
  color:var(--green);
  font-size:12px;
  margin-top:8px;
  line-height:1.6;
}

.empty {
  text-align:center;
  color:var(--muted);
  padding:30px 12px;
  background:#fff;
  border:1px dashed #ccd8e0;
  border-radius:13px;
}

@media(max-width:560px) {
  main { margin-top:18px; }
  .panel { padding:17px; }
  .stats { gap:7px; }
  .stat { padding:11px 8px; }
  .stat strong { font-size:22px; }
  .stat span { font-size:10px; }
  .filters,.manual-grid { grid-template-columns:1fr; }
  .details { grid-template-columns:1fr 1fr; }
  .appointment-head { align-items:flex-start; }
  .topbar { padding:13px; }
  .brand { font-size:16px; }
}
</style>
</head>

<body>
<header class="topbar">
  <div class="topbar-inner">
    <div>
      <div class="brand">NOVA <span>Dental Studio</span></div>
      <div class="subtitle">بوابة إدارة الحجوزات</div>
    </div>
    <button id="logoutBtn" class="btn btn-light" hidden>
      تسجيل الخروج
    </button>
  </div>
</header>

<main>

<section id="loginSection" class="panel login-panel">
  <h1>دخول السكرتيرة</h1>
  <p class="muted">يرجى تسجيل الدخول للوصول إلى حجوزات العيادة.</p>

  <form id="loginForm">
    <label for="username">اسم المستخدم</label>
    <input id="username" name="username"
      autocomplete="username" required maxlength="128">

    <label for="password">كلمة المرور</label>
    <input id="password" name="password" type="password"
      autocomplete="current-password" required maxlength="256">

    <button id="loginBtn" class="btn full" type="submit">
      تسجيل الدخول
    </button>
    <div id="loginMessage" class="message" role="alert"></div>
  </form>
</section>

<section id="dashboardSection" hidden>

  <div class="toolbar">
    <div>
      <h1>إدارة الحجوزات</h1>
      <div class="muted">عرض ومتابعة طلبات المرضى</div>
    </div>
    <button id="refreshBtn" class="btn btn-light">
      تحديث القائمة
    </button>
  </div>

  <div class="stats">
    <div class="stat">
      <strong id="totalCount">0</strong>
      <span>كل الحجوزات المعروضة</span>
    </div>
    <div class="stat">
      <strong id="pendingCount">0</strong>
      <span>بانتظار التأكيد</span>
    </div>
    <div class="stat">
      <strong id="confirmedCount">0</strong>
      <span>الحجوزات المؤكدة</span>
    </div>
  </div>

  <section class="manual-form">
    <h2>إضافة حجز يدوي</h2>
    <p class="muted">
      تسجيل حجز تم عبر الهاتف أو واتساب أو الحضور المباشر.
    </p>

    <form id="manualBookingForm">
      <div class="manual-grid">

        <div>
          <label for="manualName">اسم المريض</label>
          <input id="manualName" maxlength="100"
            autocomplete="name" required>
        </div>

        <div>
          <label for="manualPhone">رقم الهاتف</label>
          <input id="manualPhone" type="tel" maxlength="25"
            autocomplete="tel" required>
        </div>

        <div>
          <label for="manualService">الخدمة</label>
          <select id="manualService" required>
            <option value="general">علاج عام</option>
            <option value="cosmetic">تجميل الأسنان</option>
            <option value="orthodontics">تقويم الأسنان</option>
            <option value="restorative">ترميم الأسنان</option>
            <option value="implants">زراعة الأسنان</option>
            <option value="pediatric">طب أسنان الأطفال</option>
            <option value="other">خدمة أخرى</option>
          </select>
        </div>

        <div>
          <label for="manualSource">مصدر الحجز</label>
          <select id="manualSource" required>
            <option value="phone">الهاتف</option>
            <option value="whatsapp">واتساب</option>
            <option value="walk_in">حضور مباشر</option>
          </select>
        </div>

      </div>

      <button id="manualSubmitBtn" class="btn" type="submit">
        تسجيل الحجز
      </button>

      <div id="manualMessage" class="message"
        role="status" aria-live="polite"></div>
    </form>
  </section>

  <div class="filters">
    <input id="searchInput" type="search"
      placeholder="ابحث بالاسم أو الهاتف أو المرجع">

    <select id="statusFilter">
      <option value="all">كل الحالات</option>
      <option value="pending">بانتظار التأكيد</option>
      <option value="confirmed">مؤكد</option>
      <option value="rejected">مرفوض</option>
      <option value="cancelled">ملغي</option>
    </select>
  </div>

  <div id="dashboardMessage" class="message" role="alert"></div>
  <div id="appointmentList" class="appointment-list"></div>

</section>
</main>

<script>
const $ = id => document.getElementById(id);

const loginSection = $("loginSection");
const dashboardSection = $("dashboardSection");
const loginForm = $("loginForm");
const loginBtn = $("loginBtn");
const loginMessage = $("loginMessage");
const dashboardMessage = $("dashboardMessage");
const appointmentList = $("appointmentList");
const logoutBtn = $("logoutBtn");

const manualBookingForm = $("manualBookingForm");
const manualSubmitBtn = $("manualSubmitBtn");
const manualMessage = $("manualMessage");

let appointments = [];

const statusLabels = {
  pending:"بانتظار التأكيد",
  confirmed:"مؤكد",
  rejected:"مرفوض",
  cancelled:"ملغي"
};

const serviceLabels = {
  general:"علاج عام",
  cosmetic:"تجميل الأسنان",
  orthodontics:"تقويم الأسنان",
  restorative:"ترميم الأسنان",
  implants:"زراعة الأسنان",
  pediatric:"طب أسنان الأطفال",
  other:"خدمة أخرى"
};

const sourceLabels = {
  website:"الموقع الإلكتروني",
  phone:"الهاتف",
  whatsapp:"واتساب",
  walk_in:"حضور مباشر"
};

async function api(path,options={}) {
  const response = await fetch(path,{
    ...options,
    credentials:"same-origin",
    cache:"no-store",
    headers:{
      ...(options.body ? {"Content-Type":"application/json"} : {}),
      ...(options.headers || {})
    }
  });

  let data = {};
  try { data = await response.json(); } catch {}

  if (response.status === 401) {
    showLogin("انتهت جلسة الدخول. يرجى تسجيل الدخول مجدداً.");
  }

  return {response,data};
}

function showLogin(message="") {
  dashboardSection.hidden = true;
  loginSection.hidden = false;
  logoutBtn.hidden = true;
  loginMessage.textContent = message;
  appointments = [];
}

function showDashboard() {
  loginSection.hidden = true;
  dashboardSection.hidden = false;
  logoutBtn.hidden = false;
  loginMessage.textContent = "";
}

function setMessage(element,message,success=false) {
  element.textContent = message || "";
  element.classList.toggle("success-message",Boolean(success));
}

function addDetail(container,label,value,extraClass="") {
  const box = document.createElement("div");
  box.className = "detail";

  const small = document.createElement("small");
  small.textContent = label;

  const valueNode = document.createElement("div");
  valueNode.textContent = value || "غير محدد";

  if (extraClass) valueNode.className = extraClass;

  box.append(small,valueNode);
  container.append(box);
}

function createButton(label,className,callback) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "btn " + className;
  button.textContent = label;
  button.addEventListener("click",callback);
  return button;
}

function formatScheduledAt(value) {
  if (!value) return "لم يتم تحديد موعد بعد";

  const parts = value.split("T");
  if (parts.length !== 2) return value;

  const [year,month,day] = parts[0].split("-");
  const [hour,minute] = parts[1].split(":");

  return `${day}/${month}/${year} - ${hour}:${minute}`;
}

function renderAppointments() {
  const query = $("searchInput").value.trim().toLowerCase();
  const status = $("statusFilter").value;

  const filtered = appointments.filter(item => {
    const searchable = [
      item.patient_name,
      item.phone,
      item.reference
    ].join(" ").toLowerCase();

    return searchable.includes(query) &&
      (status === "all" || item.status === status);
  });

  appointmentList.replaceChildren();

  if (!filtered.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = appointments.length
      ? "لا توجد حجوزات مطابقة للبحث."
      : "لا توجد حجوزات مسجلة حالياً.";
    appointmentList.append(empty);
    return;
  }

  for (const item of filtered) {
    const card = document.createElement("article");
    card.className = "appointment";

    const head = document.createElement("div");
    head.className = "appointment-head";

    const name = document.createElement("div");
    name.className = "patient-name";
    name.textContent = item.patient_name || "مريض";

    const badge = document.createElement("span");
    badge.className = "status " + (item.status || "pending");
    badge.textContent =
      statusLabels[item.status] || item.status || "غير معروف";

    head.append(name,badge);

    const details = document.createElement("div");
    details.className = "details";

    addDetail(details,"رقم الهاتف",item.phone);
    addDetail(
      details,
      "الخدمة",
      serviceLabels[item.service_type] || item.service_type
    );
    addDetail(
      details,
      "مصدر الحجز",
      sourceLabels[item.source] || item.source || "غير محدد"
    );
    addDetail(details,"الموعد المطلوب",item.preferred_date);
    addDetail(details,"تاريخ وصول الطلب",item.created_at);
    addDetail(details,"رقم المرجع",item.reference,"reference");

    card.append(head,details);

    if (item.notes) {
      const notes = document.createElement("div");
      notes.className = "notes";
      notes.textContent = "ملاحظات: " + item.notes;
      card.append(notes);
    }

    // موعد المريض المتفق عليه مع السكرتيرة
    const scheduleBox = document.createElement("div");
    scheduleBox.className = "schedule-box";

    const scheduleLabel = document.createElement("label");
    scheduleLabel.textContent = "تاريخ ووقت الموعد المتفق عليه";
    scheduleLabel.htmlFor = "scheduled-" + item.id;

    const scheduleInput = document.createElement("input");
    scheduleInput.type = "datetime-local";
    scheduleInput.id = "scheduled-" + item.id;
    scheduleInput.value = item.scheduled_at || "";

    const currentSchedule = document.createElement("div");
    currentSchedule.className = "schedule-current";
    currentSchedule.textContent = item.scheduled_at
      ? "الموعد المحفوظ: " + formatScheduledAt(item.scheduled_at)
      : "لم يتم حفظ موعد متفق عليه.";

    const saveButton = createButton(
      "حفظ التاريخ والساعة",
      "",
      () => saveScheduledAt(item.id,scheduleInput.value,saveButton)
    );

    scheduleBox.append(
      scheduleLabel,
      scheduleInput,
      saveButton,
      currentSchedule
    );

    card.append(scheduleBox);

    const actions = document.createElement("div");
    actions.className = "actions";

    if (item.status === "pending") {
      actions.append(
        createButton("تأكيد الحجز","btn-green",() =>
          updateStatus(item.id,"confirmed")
        ),
        createButton("رفض الطلب","btn-red",() =>
          updateStatus(item.id,"rejected")
        )
      );
    } else if (item.status === "confirmed") {
      actions.append(
        createButton("إلغاء الحجز","btn-red",() =>
          updateStatus(item.id,"cancelled")
        )
      );
    }

    if (actions.children.length) card.append(actions);
    appointmentList.append(card);
  }
}

async function loadAppointments() {
  setMessage(dashboardMessage,"جارٍ تحميل الحجوزات...");
  $("refreshBtn").disabled = true;

  try {
    const {response,data} =
      await api("/api/admin/appointments");

    if (!response.ok || data.ok !== true) {
      if (response.status !== 401) {
        setMessage(dashboardMessage,"تعذر تحميل الحجوزات. حاول مجدداً.");
      }
      return;
    }

    appointments = Array.isArray(data.appointments)
      ? data.appointments
      : [];

    $("totalCount").textContent = appointments.length;
    $("pendingCount").textContent =
      appointments.filter(item => item.status === "pending").length;
    $("confirmedCount").textContent =
      appointments.filter(item => item.status === "confirmed").length;

    setMessage(dashboardMessage,"");
    renderAppointments();

  } catch {
    setMessage(dashboardMessage,"تعذر الاتصال بالخادم.");
  } finally {
    $("refreshBtn").disabled = false;
  }
}

async function saveScheduledAt(id,value,button) {
  button.disabled = true;
  button.textContent = "جارٍ الحفظ...";

  try {
    const {response,data} = await api(
      "/api/admin/appointments/update",
      {
        method:"POST",
        body:JSON.stringify({
          id,
          scheduled_at:value
        })
      }
    );

    if (!response.ok || data.ok !== true) {
      if (response.status !== 401) {
        setMessage(
          dashboardMessage,
          data.error === "invalid_scheduled_at"
            ? "التاريخ أو الساعة غير صالحين."
            : "تعذر حفظ الموعد. حاول مجدداً."
        );
      }
      return;
    }

    await loadAppointments();

    setMessage(
      dashboardMessage,
      value
        ? "تم حفظ الموعد المتفق عليه. اضغط «تأكيد الحجز» لتأكيده."
        : "تم مسح الموعد المحفوظ.",
      true
    );

  } catch {
    setMessage(dashboardMessage,"تعذر الاتصال بالخادم.");
  } finally {
    button.disabled = false;
    button.textContent = "حفظ التاريخ والساعة";
  }
}

async function createManualAppointment(event) {
  event.preventDefault();

  manualSubmitBtn.disabled = true;
  manualSubmitBtn.textContent = "جارٍ التسجيل...";
  setMessage(manualMessage,"");

  const payload = {
    patient_name:$("manualName").value.trim(),
    phone:$("manualPhone").value.trim(),
    service_type:$("manualService").value,
    source:$("manualSource").value
  };

  try {
    const {response,data} = await api(
      "/api/admin/appointments/create",
      {
        method:"POST",
        body:JSON.stringify(payload)
      }
    );

    if (!response.ok || data.ok !== true) {
      if (response.status !== 401) {
        const message = data.error === "invalid_input"
          ? "تحقق من الاسم ورقم الهاتف والخدمة."
          : "تعذر تسجيل الحجز. حاول مجدداً.";

        setMessage(manualMessage,message);
      }
      return;
    }

    manualBookingForm.reset();
    setMessage(
      manualMessage,
      "تم تسجيل الحجز اليدوي بنجاح.",
      true
    );

    await loadAppointments();

  } catch {
    setMessage(manualMessage,"تعذر الاتصال بالخادم.");
  } finally {
    manualSubmitBtn.disabled = false;
    manualSubmitBtn.textContent = "تسجيل الحجز";
  }
}

async function updateStatus(id,status) {
  const confirmation = {
    confirmed:"هل تريد تأكيد هذا الحجز؟",
    rejected:"هل تريد رفض طلب الحجز؟",
    cancelled:"هل تريد إلغاء هذا الحجز؟"
  };

  if (!window.confirm(confirmation[status])) return;

  try {
    const {response,data} = await api(
      "/api/admin/appointments/update",
      {
        method:"POST",
        body:JSON.stringify({id,status})
      }
    );

    if (!response.ok || data.ok !== true) {
      if (response.status !== 401) {
        setMessage(dashboardMessage,"لم يتم تحديث حالة الحجز.");
      }
      return;
    }

    await loadAppointments();
    setMessage(dashboardMessage,"تم تحديث حالة الحجز.",true);

  } catch {
    setMessage(dashboardMessage,"تعذر الاتصال بالخادم.");
  }
}

loginForm.addEventListener("submit",async event => {
  event.preventDefault();

  loginBtn.disabled = true;
  loginBtn.textContent = "جارٍ التحقق...";
  setMessage(loginMessage,"");

  try {
    const {response,data} = await api("/api/admin/login",{
      method:"POST",
      body:JSON.stringify({
        username:$("username").value.trim(),
        password:$("password").value
      })
    });

    if (!response.ok || data.ok !== true) {
      const message = data.error === "rate_limited"
        ? "تم إيقاف المحاولات مؤقتاً. حاول بعد 15 دقيقة."
        : data.error === "server_configuration_error"
          ? "إعداد حساب السكرتيرة غير مكتمل على الخادم."
          : "اسم المستخدم أو كلمة المرور غير صحيحة.";

      setMessage(loginMessage,message);
      return;
    }

    $("password").value = "";
    showDashboard();
    await loadAppointments();

  } catch {
    setMessage(loginMessage,"تعذر الاتصال بالخادم.");
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = "تسجيل الدخول";
  }
});

manualBookingForm.addEventListener(
  "submit",
  createManualAppointment
);

logoutBtn.addEventListener("click",async () => {
  try {
    await api("/api/admin/logout",{method:"POST"});
  } finally {
    showLogin("تم تسجيل الخروج.");
  }
});

$("refreshBtn").addEventListener("click",loadAppointments);
$("searchInput").addEventListener("input",renderAppointments);
$("statusFilter").addEventListener("change",renderAppointments);

async function restoreSession() {
  try {
    const {response,data} = await api("/api/admin/session");

    if (response.ok && data.authenticated === true) {
      showDashboard();
      await loadAppointments();
    } else {
      showLogin();
    }
  } catch {
    showLogin("تعذر الاتصال بالخادم.");
  }
}

restoreSession();
</script>
</body>
</html>
